# Configuration mise (https://mise.jdx.dev)
# Gère les outils (Python, uv) et les tâches du projet.

[tools]
python = "3.12"
uv = "latest"

[tasks.install]
description = "Installer les dépendances partagées (uv sync)"
run = "uv sync"

[tasks.tp1]
description = "TP 1 - Régression linéaire (1 neurone)"
dir = "01-regression-lineaire"
run = "uv run main.py"

[tasks.tp2]
description = "TP 2 - Spam ou pas spam (classification, 1 neurone)"
dir = "02-spam-ou-pas-spam"
run = "uv run main.py"

[tasks.tp3]
description = "TP 3 - XOR et couche cachée (pourquoi plusieurs neurones)"
dir = "03-xor-couche-cachee"
run = "uv run main.py"

[tasks.tp4]
description = "TP 4 - Reconnaissance de chiffres MNIST (PyTorch)"
dir = "04-mnist-pytorch"
run = "uv run main.py"

[tasks.tp5-data]
description = "TP 5 - Construire le dataset pommes/poires (Bing, Wikimedia...)"
dir = "05-my-own-dataset"
run = "uv run telecharger_dataset.py"

[tasks.tp5-data-jlg]
description = "TP 5 - Télécharger LE dataset figé de JLG (reproductible)"
dir = "05-my-own-dataset"
run = "uv run telecharger_dataset_jlg.py"

[tasks.tp5]
description = "TP 5 - Images personnelles (créer son dataset, transfer learning)"
dir = "05-my-own-dataset"
run = "uv run main.py"
