# Configuration mise (https://mise.jdx.dev)
# Gère les outils (Python, uv) et les tâches du projet.

[tools]
python = "3.12"
uv = "latest"

[tasks.install]
description = "Installer les dépendances partagées (uv sync)"
run = "uv sync"

[tasks.tp1]
description = "TP 1 - Régression linéaire (1 neurone)"
dir = "01-regression-lineaire"
run = "uv run main.py"

[tasks.tp2]
description = "TP 2 - Spam ou pas spam (classification, 1 neurone)"
dir = "02-spam-ou-pas-spam"
run = "uv run main.py"

[tasks.tp3]
description = "TP 3 - XOR et couche cachée (pourquoi plusieurs neurones)"
dir = "03-xor-couche-cachee"
run = "uv run main.py"

[tasks.tp4]
description = "TP 4 - Reconnaissance de chiffres MNIST (PyTorch)"
dir = "04-mnist-pytorch"
run = "uv run main.py"
